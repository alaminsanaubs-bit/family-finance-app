<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#123b32">

</style>
</head>
<body>

<script>
if("serviceWorker" in navigator){
 window.addEventListener("load",function(){
  navigator.serviceWorker.register("/family-finance-app/service-worker.js",
   {scope:"/family-finance-app/"}).catch(function(e){console.error(e);});
 });
}
</script>
</body></html>
